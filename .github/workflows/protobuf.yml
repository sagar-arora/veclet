name: Protobuf checks

on:
  pull_request:
    paths:
      - api/proto/**
      - buf.yaml
      - Makefile
      - .github/workflows/protobuf.yml
  push:
    branches:
      - main
    paths:
      - api/proto/**
      - buf.yaml
      - Makefile
      - .github/workflows/protobuf.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protobuf:
    name: Build, format, lint, and compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Install Buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: "1.72.0"
          checksum: "8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af"
          setup_only: true
      - name: Build, format, and lint
        run: make check-proto
      - name: Check pull-request compatibility
        if: github.event_name == 'pull_request'
        env:
          PROTO_BASELINE: ${{ github.event.pull_request.base.sha }}
        run: ./tools/ci/check-proto-breaking.sh "$PROTO_BASELINE"
      - name: Check push compatibility
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          PROTO_BASELINE: ${{ github.event.before }}
        run: ./tools/ci/check-proto-breaking.sh "$PROTO_BASELINE"
