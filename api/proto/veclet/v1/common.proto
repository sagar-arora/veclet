syntax = "proto3";

package veclet.v1;

option go_package = "github.com/sagar-arora/veclet/gen/go/veclet/v1;vecletv1";

// Metric identifies the collection-wide comparison and score ordering.
enum Metric {
  METRIC_UNSPECIFIED = 0;

  // Squared Euclidean distance. Lower scores are better.
  METRIC_L2 = 1;

  // Raw inner-product similarity. Higher scores are better.
  METRIC_INNER_PRODUCT = 2;

  // Inner product over normalized stored and query vectors. Higher is better.
  METRIC_COSINE = 3;
}

// Neighbor is one vector-search result.
message Neighbor {
  // vector_id is positive and unique within its collection.
  int64 vector_id = 1;

  // score uses the collection metric's native ordering. It must be finite.
  float score = 2;
}

// VectorRecord is the insert-only mutation accepted by BatchInsert in v1.
message VectorRecord {
  // vector_id is a positive int64 and is unique within its collection. V1 uses
  // integers to match FAISS IDs without a string-to-integer mapping layer.
  int64 vector_id = 1;

  // version is positive. The initial insert normally uses version 1.
  uint64 version = 2;

  // embedding is canonical float32. It must match the collection dimension and
  // contain only finite values. Integer sources are converted at ingestion.
  repeated float embedding = 3;

  // payload_data is opaque UTF-8 user data of at most 16 KiB. V1 stores it but
  // does not parse it for filtering, partitioning, or routing.
  string payload_data = 4;
}
